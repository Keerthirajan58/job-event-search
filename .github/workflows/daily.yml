# Daily job-event digest -> GitHub Pages.
#
# Cost: ~8 of the 2000 free Actions minutes per month. Nothing here is paid.
#
# Design notes, because three obvious approaches do not work:
#
#  1. data/events.db is restored with actions/cache, NOT committed: a regenerable
#     5 MB binary would add ~50 MB of pack per two months.
#  2. first_seen dates are the exception. They are the one thing in that database
#     that cannot be recomputed, and relying on the cache for them was a real bug -
#     when it missed, every listing read as brand new and the "New" tab showed the
#     entire window. They now live in data/first_seen.json, which this job commits
#     back after every run. Same for data/attendance.db and data/triage.json, which
#     hold logged outcomes and Going/Saved marks. The cache therefore names
#     individual regenerable paths, never the whole data/ dir.
#  3. The `secrets` context is not available in step-level `if:`. The optional
#     notification step therefore maps the secret to env and tests the env var.
name: daily-digest

on:
  schedule:
    # 13:00 UTC = 06:00 PDT. Becomes 05:00 PST after 1 Nov; change to "0 14 * * *"
    # if you want a steady 06:00 local time year round.
    - cron: "0 13 * * *"
  workflow_dispatch:          # run it by hand from the Actions tab
  push:
    branches: [main]          # first deploy happens as soon as you push
    paths-ignore: ["**.md"]

permissions:
  contents: write      # to commit data/first_seen.json back after each run
  pages: write
  id-token: write

# Never let a scheduled run and a manual run deploy over each other.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: America/Los_Angeles
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Rotating key: the cache is immutable once written, so a run-scoped key
      # plus a prefix restore-key gives us "load newest, save fresh".
      # Cache ONLY the regenerable files. Caching the whole data/ directory would
      # restore a stale copy over data/attendance.db and data/triage.json, both of
      # which are committed to git and are the irreplaceable half of the state.
      - name: Restore event history
        uses: actions/cache@v4
        with:
          path: |
            data/cache
            data/events.db
          key: jobevents-data-${{ github.run_id }}
          restore-keys: |
            jobevents-data-

      - name: Unit tests (no network, no build needed)
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Generate digest
        run: python3 run.py

      - name: Dashboard tests
        run: |
          npm install --no-save --no-audit --no-fund --silent jsdom
          node tests/dashboard.test.js

      # first_seen.json is the durable half of the state. Committing it is what
      # makes the "New" tab mean anything the day after a cache eviction.
      - name: Persist first-seen history
        run: |
          if [ -n "$(git status --porcelain data/first_seen.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/first_seen.json
            git commit -m "chore: first-seen history $(date -u +%Y-%m-%d)"
            git push
          else
            echo "no change to first-seen history"
          fi

      - name: Check the artifact is real
        run: |
          test -s out/index.html || { echo "::error::index.html missing or empty"; exit 1; }
          test -s out/digest.json || { echo "::error::digest.json missing"; exit 1; }
          grep -q 'noindex' out/index.html || { echo "::error::noindex meta missing"; exit 1; }
          grep -q 'data-panel="calendar"' out/index.html || { echo "::error::tab bar missing"; exit 1; }
          grep -q 'jes.triage' out/index.html || { echo "::error::triage script missing"; exit 1; }
          test -s data/first_seen.json || { echo "::error::first_seen history missing"; exit 1; }
          # If literally everything reads as new, first_seen was lost again.
          python3 - <<'PY'
          import json, sys
          d = json.load(open("out/digest.json"))
          rec = [e for v in d["days"].values() for e in v["recommended"]]
          if len(rec) > 20 and all(e.get("age_days") == 0 for e in rec):
              sys.exit("::error::every listing reads as first-seen-today - history was lost")
          print("age check ok: %d/%d first seen today"
                % (sum(1 for e in rec if e.get("age_days") == 0), len(rec)))
          PY
          python3 -c "import json;d=json.load(open('out/digest.json'));print('events:',d['meta']['unique_events'],'recommended:',d['meta']['recommended'])"

      - name: Summary
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("out/digest.json"))
          m = d["meta"]
          print("## Digest for %s .. %s\n" % (m["window_start"], m["window_end"]))
          print("| | |\n|---|---|")
          for k in ("raw_listings","unique_events","recommended","gated","changed",
                    "with_openings","runtime_s"):
              print("| %s | %s |" % (k.replace("_"," "), m.get(k)))
          print("\n### Highest scoring\n")
          rec = [e for v in d["days"].values() for e in v["recommended"]]
          for e in sorted(rec, key=lambda x: -x["score"])[:10]:
              print("- **%d/100 %s** %s - [%s](%s)"
                    % (e["score"], e.get("verdict",""), e["date"], e["title"], e["url"]))
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Optional Telegram push
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: |
          if [ -n "$TELEGRAM_TOKEN" ] && [ -n "$TELEGRAM_CHAT" ]; then
            python3 -m jobevents.notify
          else
            echo "No Telegram secrets set - skipping (this is fine)."
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
